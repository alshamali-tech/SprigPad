<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BranchPad — Free Offline Mind Mapping</title>
    <meta name="description" content="BranchPad is a free, offline-first mind mapping tool. Unlimited maps, no account, no watermark. Export JSON, OPML, Markdown, PNG, SVG and PDF. Your data never leaves your browser." />
    <meta name="keywords" content="free mind map maker, MindMeister alternative free, mind map online no sign up, offline mind mapping tool, mind map no watermark, mind map export JSON, OPML" />
    <meta property="og:title" content="BranchPad — Free Offline Mind Mapping" />
    <meta property="og:description" content="Unlimited mind maps. No account. No limits. Works offline. Your data stays in your browser." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Display face for headings; falls back to system-ui so the app never depends on the network -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "BranchPad",
        "operatingSystem": "Web",
        "applicationCategory": "ProductivityApplication",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Free, offline-first mind mapping. Unlimited maps, no account, no watermark."
      }
    </script>
    <script>
      try {
        var t = localStorage.getItem("bp-theme");
        var dark = t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
